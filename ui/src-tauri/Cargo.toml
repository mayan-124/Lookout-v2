[package]
name = "lookout"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

# Test harness exes of Tauri apps fail to start on Windows without an app
# manifest; testable logic lives in lookout-core instead.
[lib]
name = "lookout_lib"
test = false
doctest = false

[[bin]]
name = "lookout"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lookout-core = { workspace = true, features = ["download"] }
lookout-cli.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# ShellExecute instead of the default PowerShell launcher: same exact-path behaviour,
# about 2.5x faster to the first open (see docs/decisions.md, Phase 2).
open = { version = "5", features = ["shellexecute-on-windows"] }
tauri-plugin-updater = "2"

# Already in the tree through wry; named here to call ICoreWebView2Controller::SetIsVisible
# and ICoreWebView2_19::SetMemoryUsageTargetLevel.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[lints]
workspace = true
