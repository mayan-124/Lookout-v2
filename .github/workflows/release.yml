name: Release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check versions match
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)^\[workspace\.package\][^\[]*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          $versions = [ordered]@{
            "tauri.conf.json" = (Get-Content ui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            "Cargo.toml"      = $cargo
            "package.json"    = (Get-Content ui/package.json -Raw | ConvertFrom-Json).version
          }
          if ($env:REF -like "refs/tags/v*") { $versions["tag"] = $env:REF.Substring("refs/tags/v".Length) }
          $found = ($versions.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ", "
          if (-not $cargo -or @($versions.Values | Sort-Object -Unique -CaseSensitive).Count -ne 1) { throw "Versions do not match: $found" }
          Write-Host "Versions match: $found"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      - name: Build and stage plugins
        run: |
          cargo build --locked --release -p lookout-clipboard -p lookout-files-tools -p lookout-semantic -p lookout-office-text -p lookout-screenshot -p lookout-fastscan -p lookout-cli
          ./scripts/stage_plugins.ps1 release

      - name: Check staged plugins
        shell: pwsh
        run: |
          $map = @{ "clipboard" = "lookout-clipboard"; "files-tools" = "lookout-files-tools"; "semantic" = "lookout-semantic"; "office-text" = "lookout-office-text"; "screenshot" = "lookout-screenshot" }
          foreach ($f in $map.Keys) {
            $dir = "target/release/plugins/$f"
            foreach ($file in "$($map[$f]).exe", "plugin.json") {
              if (-not (Test-Path "$dir/$file")) { throw "Missing $dir/$file" }
            }
          }
          # plugin.json must parse, name its exe, and carry the Add-ons summary
          foreach ($f in $map.Keys) {
            $m = Get-Content "target/release/plugins/$f/plugin.json" -Raw | ConvertFrom-Json
            if ($m.entry -ne "$($map[$f]).exe") { throw "$f plugin.json entry is $($m.entry)" }
          }
          $shot = Get-Content target/release/plugins/screenshot/plugin.json -Raw | ConvertFrom-Json
          if ($shot.name -ne "Screenshot" -or -not $shot.summary -or -not $shot.approval_note) { throw "screenshot manifest needs name, summary and approval_note" }
          # the release exe must not contain demo/review code (feature "review")
          $shotExe = "target/release/plugins/screenshot/lookout-screenshot.exe"
          $demo = "Recording Bar Demo"
          if (Select-String -Path $shotExe -Pattern $demo -Quiet -Encoding ascii) { throw "screenshot exe contains review-only code" }
          if (Select-String -Path $shotExe -Pattern (($demo.ToCharArray() -join "\0")) -Quiet -Encoding ascii) { throw "screenshot exe contains review-only code (UTF-16)" }
          foreach ($exe in Get-ChildItem target/release/plugins -Recurse -Filter *.exe) {
            if (Select-String -Path $exe.FullName -Pattern "winhttp" -Quiet -Encoding ascii) { throw "$($exe.Name) contains winhttp" }
            if (Select-String -Path $exe.FullName -Pattern "w\0i\0n\0h\0t\0t\0p" -Quiet -Encoding ascii) { throw "$($exe.Name) contains winhttp (UTF-16)" }
          }

      - name: Check fast-scan helper
        shell: pwsh
        run: |
          $exe = "target/release/helpers/fastscan/lookout-fastscan.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          # read-only helper: no network code of any kind
          foreach ($p in "winhttp", "wininet", "ws2_32", "WSAStartup", "urlmon", "InternetOpen") {
            if (Select-String -Path $exe -Pattern $p -Quiet -Encoding ascii) { throw "fastscan helper contains $p" }
            if (Select-String -Path $exe -Pattern (($p.ToCharArray() -join "\0")) -Quiet -Encoding ascii) { throw "fastscan helper contains $p (UTF-16)" }
          }

      - name: Build NSIS installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: npm run tauri build -- --config src-tauri/tauri.installer.conf.json -- --locked
        working-directory: ui

      # Tag builds only: also sign the installer for the updater. The key comes from secrets only.
      - name: Build and sign NSIS installer
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        # A secret piped from Windows PowerShell can start with a UTF-8 BOM, which the signer rejects.
        run: |
          bom=$'\xEF\xBB\xBF'
          export TAURI_SIGNING_PRIVATE_KEY="${TAURI_SIGNING_PRIVATE_KEY#"$bom"}"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD#"$bom"}"
          npm run tauri build -- --config src-tauri/tauri.installer.conf.json --config src-tauri/tauri.release.conf.json -- --locked
        working-directory: ui

      - uses: actions/upload-artifact@v5
        with:
          name: lookout-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release with latest.json
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $TAG.TrimStart("v")
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sigFile = "$($exe.FullName).sig"
          if (-not (Test-Path $sigFile)) { throw "Missing signature $sigFile" }
          # never replace files of a release: stop if it already has any
          $assets = gh release view $TAG --json assets --jq '.assets | length' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $TAG --draft --generate-notes --title $TAG
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release $TAG" }
          } elseif ([int]$assets -ne 0) {
            throw "Release $TAG already has $assets asset(s). Nothing was uploaded."
          }
          # gh prints one array element per line; latest.json needs "notes" to be one string
          $notes = (gh release view $TAG --json body --jq .body) -join "`n"
          $url = "https://github.com/${env:GITHUB_REPOSITORY}/releases/download/$TAG/$($exe.Name)"
          $latest = [ordered]@{
            version  = $version
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigFile -Raw).Trim()
                url       = $url
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          gh release upload $TAG $exe.FullName $sigFile latest.json
          if ($LASTEXITCODE -ne 0) { throw "Upload to $TAG failed" }
