[workspace]
resolver = "2"
members = ["core", "cli", "bench", "ui/src-tauri", "plugins/clipboard", "plugins/files-tools", "plugins/semantic", "plugins/office-text", "plugins/screenshot", "helpers/fastscan"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
lookout-core = { path = "core" }
lookout-cli = { path = "cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
