[package]
name = "lookout-semantic"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "lookout_semantic"
path = "src/lib.rs"

[[bin]]
name = "lookout-semantic"
path = "src/main.rs"

[dependencies]
lookout-core.workspace = true
# Pinned exactly: the runtime DLL the user supplies is version-checked by ort at
# load time, and the pin keeps the Rust side reproducible. load-dynamic: no
# runtime is bundled or downloaded; it is loaded from an absolute path only.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
# NFD decomposition and combining-mark test, for the tokenizer's accent stripping.
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
# Snowball stemmer for the evaluation example's keyword baseline.
rust-stemmers = "1.2"

[target.'cfg(windows)'.dev-dependencies]
# Private working set of the helper process, for the evaluation example only.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
