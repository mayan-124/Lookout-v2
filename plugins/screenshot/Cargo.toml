[package]
name = "lookout-screenshot"
version = "0.1.0"
edition = "2021"

[features]
default = []
review = []

[lib]
name = "lookout_screenshot"
path = "src/lib.rs"

[[bin]]
name = "lookout-screenshot"
path = "src/main.rs"

[dependencies]
lookout-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18.1"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_StationsAndDesktops",
    "Win32_System_WinRT",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"
