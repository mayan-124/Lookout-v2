[package]
name = "lookout-files-tools"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "lookout_files_tools"
path = "src/lib.rs"

[[bin]]
name = "lookout-files-tools"
path = "src/main.rs"

[dependencies]
lookout-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Graphics_Imaging", "Storage", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile = "3"
png = "0.18.1"
